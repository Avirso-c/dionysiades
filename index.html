<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#d3d9df">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Les Dionysiades</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@900&family=Inter:wght@400;700&display=swap">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#d3d9df,#f1f3f5) fixed;color:#14181d;font-family:Inter,system-ui,sans-serif;font-size:19px;line-height:1.35}
main{max-width:460px;margin:0 auto;padding:24px 20px 60px;display:flex;flex-direction:column;gap:16px}
h1{font-family:Doto,Inter,sans-serif;font-weight:900;font-size:32px;margin:0;letter-spacing:.5px}
.app{font-size:14px;color:#464c54;margin:0;letter-spacing:1px;text-transform:uppercase}
.card{border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.6);box-shadow:0 8px 24px rgba(20,24,29,.10);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.big{font-size:26px;font-weight:700;margin:0}
.grey{color:#464c54;font-size:15px;margin:0}
details{border-top:1px solid rgba(20,24,29,.10);padding-top:10px}
details:first-of-type{border-top:0;padding-top:0}
summary{display:flex;justify-content:space-between;gap:12px;cursor:pointer;list-style:none;min-height:44px;align-items:center}
summary::-webkit-details-marker{display:none}
summary b{white-space:nowrap}
.why{font-size:15px;color:#464c54;margin:6px 0 4px}
.dot{width:26px;height:26px;border-radius:50%;flex:none}
.row{display:flex;align-items:center;gap:12px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:56px;height:56px;border-radius:18px;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.7);font-size:28px;font-weight:700;color:#14181d;cursor:pointer}
input{font:700 22px Inter,system-ui,sans-serif;color:#14181d;border:1px solid rgba(20,24,29,.25);border-radius:14px;padding:10px 12px;width:100%;min-height:52px;background:#fff}
label{display:flex;flex-direction:column;gap:4px;font-size:15px;color:#464c54}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.alert{background:#fde8e6;border-color:#b91c1c}
.tag{font-size:12px;border-radius:999px;padding:2px 8px;background:#e6eaee;color:#464c54;white-space:nowrap}
.tag.ok{background:#dff1e4;color:#165c2d}
nav{display:flex;gap:8px}
nav a{flex:1;text-align:center;min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:16px;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.45);color:#14181d;font-weight:700;text-decoration:none}
nav a.on{background:#14181d0d;border-color:#14181d}
section{display:flex;flex-direction:column;gap:16px}
section[hidden]{display:none}
.btn{min-height:56px;border-radius:18px;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.7);font:700 18px Inter,system-ui,sans-serif;color:#14181d;cursor:pointer;padding:8px 12px}
.btn.go{background:#1e7a3c;color:#fff;border-color:#1e7a3c;min-height:64px;font-size:20px}
.err{color:#b91c1c;font-weight:700;margin:0}
.art{border-top:1px solid rgba(20,24,29,.10);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.art:first-of-type{border-top:0;padding-top:0}
textarea{width:100%;min-height:120px;font:13px ui-monospace,monospace;border-radius:12px;border:1px solid rgba(20,24,29,.25);padding:8px}
.bar{height:14px;border-radius:999px;background:rgba(20,24,29,.10);overflow:hidden}
.bar div{height:100%;background:#1e7a3c}
a.tile{display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;color:#14181d}
a.tile b{font-size:22px}
a.ext{color:#14181d;font-weight:700}
.coach{margin:0;font-size:18px;min-height:50px}
.scene{position:relative;height:300px;perspective:1000px;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.rail{position:absolute;left:50%;top:14px;width:280px;height:64px;margin-left:-140px;border:2px solid rgba(20,24,29,.35);border-radius:50%;transform:rotateX(72deg);box-shadow:0 0 24px rgba(255,255,255,.9)}
.ring{position:absolute;left:50%;top:42px;width:0;height:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.ring.drag{transition:none}
.piece{position:absolute;left:-70px;top:0;width:140px;transform-style:preserve-3d;transition:opacity .4s}
.swing{transform-origin:50% 0;animation:sway 4.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotateZ(-1.6deg)}50%{transform:rotateZ(1.6deg)}}
.hook{width:2px;height:20px;background:#14181d;margin:0 auto;opacity:.6}
.hanger{display:block;margin:-2px auto -6px}
.etq{border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.66);box-shadow:0 14px 34px rgba(20,24,29,.18);border-radius:22px;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;backface-visibility:hidden}
.etq span{font-size:13px;font-weight:700;text-align:center;line-height:1.2;min-height:32px}
.floor{position:absolute;left:50%;bottom:-6px;width:320px;height:56px;margin-left:-160px;border-radius:50%;background:radial-gradient(closest-side,rgba(20,24,29,.20),rgba(20,24,29,0))}
.navb{display:flex;gap:10px;align-items:center}
.navb button{flex:none;width:56px;height:56px;border-radius:18px;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.7);font-size:26px;font-weight:700;color:#14181d;cursor:pointer}
.navb p{flex:1;text-align:center}
a.go,a.sec{display:flex;align-items:center;justify-content:center;border-radius:18px;font-weight:700;text-decoration:none}
a.go{min-height:62px;background:#1e7a3c;color:#fff;font-size:19px}
a.sec{min-height:52px;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.75);color:#14181d;font-size:17px}
.pills{display:flex;gap:8px}
.pills a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;justify-content:center;border-radius:16px;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.5);color:#14181d;text-decoration:none;font-size:13px}
.pills a b{font-size:17px}
.btn.sel{border-color:#14181d;background:#14181d0d}
.msg{background:#fff;border-radius:14px;padding:12px;font-size:17px;border:1px solid rgba(20,24,29,.15)}
@media (prefers-reduced-motion:reduce){.swing{animation:none}.ring{transition:none}}
.op .adm{display:none!important}
body.attente main{opacity:.6;pointer-events:none}
</style>
</head>
<body>
<main>
<p class="app">Les Dionysiades</p>
<nav id="nav"><a href="#aujourdhui" id="n-aujourdhui">Accueil</a><a href="#journal" id="n-journal">Journal</a><a href="#argent" id="n-argent" class="adm-nav">Et si…</a></nav>
<section id="v-connexion" hidden><h1>Les Dionysiades</h1><div id="x-out"></div></section>
<section id="v-aujourdhui"><p class="coach" id="coach" aria-live="polite"></p>
<div class="scene" id="scene" role="group" aria-label="Portant tournant : les articles à chercher"><div class="rail"></div><div class="ring" id="ring"></div><div class="floor"></div></div>
<div class="navb"><button type="button" id="prev" aria-label="Article précédent">‹</button><p id="pos" class="grey"></p><button type="button" id="next" aria-label="Article suivant">›</button></div>
<div id="a-out"></div></section>
<section id="v-plan" hidden><h1>Mes étapes</h1><div id="p-out"></div><a class="ext" href="#aujourdhui">Retour</a></section>
<section id="v-annonce" hidden><h1>Une annonce</h1><div id="n-out"></div><a class="ext" href="#aujourdhui">Retour</a></section>
<section id="v-releve" hidden><h1>Relevé du jour</h1><div id="r-out"></div><a class="ext" href="#aujourdhui">Retour</a></section>
<section id="v-chercher" hidden><h1>À chercher</h1><div id="c-out"></div><a class="ext" href="#aujourdhui">Retour</a></section>
<section id="v-journal" hidden><h1>Mon journal</h1><div id="j-out"></div></section>
<section id="v-argent" hidden><h1>Ton argent</h1>
<div class="card">
<label for="cap">Tu as combien pour commencer ?</label>
<div class="stepper"><button type="button" id="moins" aria-label="Enlever 10 euros">−</button><input id="cap" type="number" inputmode="decimal" min="0" step="10"><button type="button" id="plus" aria-label="Ajouter 10 euros">+</button></div>
</div>
<div id="out"></div>
<details class="card adm" id="admin"><summary><b>Réglages (Admin)</b><span class="grey">Ouvrir</span></summary><div class="grid" id="params"></div><p class="grey">Chaque réglage change tous les calculs tout de suite.</p></details>
</section>
</main>
<script>
let config = {
  "nom_application": "Les Dionysiades",
  "_lisezmoi": "Tous les chiffres modifiables sont ici. 'source' + 'date' = vérifié. 'hypothese': true = à vérifier avant usage réel.",
  "vinted": {
    "frais_vendeur_pct": {
      "valeur": 0,
      "source": "https://www.vinted.fr/pro (Vinted Pro gratuit, mise en ligne sans frais)",
      "date": "2026-11-26",
      "note": "Un site tiers (vintedcrm.com) annonce 5 % pour les Pro : à confirmer dans les Termes et conditions Vinted Pro à l'inscription."
    },
    "frais_acheteur_pct": {
      "valeur": 5,
      "source": "https://www.vinted.fr/help/342",
      "date": "2026-11-26"
    },
    "frais_acheteur_fixe_eur": {
      "valeur": 0.7,
      "source": "https://www.vinted.fr/help/342",
      "date": "2026-11-26"
    }
  },
  "statut": {
    "cotisations_pct_du_prix_de_vente": {
      "valeur": 12.3,
      "source": "https://www.economie.gouv.fr/micro-entreprises-quel-est-le-montant-de-vos-cotisations-sociales",
      "date": "2026-11-26"
    },
    "plafond_ca_micro_eur": {
      "valeur": 203100,
      "source": "https://propulsebyca.fr/micro-entrepreneur/achat-revente",
      "date": "2026-11-26"
    },
    "franchise_tva_eur": {
      "valeur": 85000,
      "source": "https://propulsebyca.fr/micro-entrepreneur/achat-revente",
      "date": "2026-11-26"
    }
  },
  "transport": {
    "navigo_mois_eur": {
      "valeur": 90.8,
      "source": "https://www.iledefrance-mobilites.fr/tarifs-titre-de-transport-en-commun-2026",
      "date": "2026-11-26"
    },
    "navigo_semaine_eur": {
      "valeur": 32.4,
      "source": "https://bonjour-ratp.fr/actualites/articles/tarifs-forfaits-navigo-2026",
      "date": "2026-11-26"
    },
    "ticket_metro_eur": {
      "valeur": 2.55,
      "source": "https://bonjour-ratp.fr/actualites/articles/tarifs-forfaits-navigo-2026",
      "date": "2026-11-26"
    }
  },
  "depart": {
    "capital_total_eur": {
      "valeur": 100,
      "source": "Décision de Cyrille (Admin)",
      "date": "2026-11-26"
    },
    "tickets_premier_cycle": {
      "valeur": 8,
      "hypothese": true,
      "note": "4 allers-retours pour aller chercher des articles"
    },
    "materiel_eur": {
      "valeur": 10,
      "hypothese": true,
      "note": "ruban adhésif + mètre ; emballages récupérés ; prix à relever en magasin"
    },
    "reserve_pct_du_capital": {
      "valeur": 20,
      "hypothese": true
    },
    "creation_entreprise_eur": {
      "valeur": 0,
      "hypothese": true
    }
  },
  "securite": {
    "max_pct_du_stock_par_article": {
      "valeur": 10,
      "hypothese": true
    },
    "emballage_par_article_eur": {
      "valeur": 0.3,
      "hypothese": true
    },
    "jours_avant_alerte_stock": {
      "valeur": 14,
      "source": "Cahier des charges de Cyrille (alerte à 14 jours)",
      "date": "2026-11-26"
    }
  },
  "feux": {
    "vert_gain_min_eur": {
      "valeur": 5,
      "hypothese": true
    },
    "vert_roi_min_pct": {
      "valeur": 100,
      "hypothese": true
    },
    "orange_gain_min_eur": {
      "valeur": 2,
      "hypothese": true
    }
  },
  "releve": {
    "jours_fenetre": {
      "valeur": 7,
      "hypothese": true
    },
    "min_releves": {
      "valeur": 2,
      "hypothese": true,
      "note": "un seul relevé ne change pas le score : on attend une confirmation"
    },
    "points_par_cran": {
      "valeur": 10,
      "hypothese": true
    }
  },
  "nego": {
    "remise_aujourdhui_pct": {
      "valeur": 5,
      "hypothese": true,
      "note": "annonce du jour : on demande peu"
    },
    "remise_jours_pct": {
      "valeur": 15,
      "hypothese": true
    },
    "remise_mois_pct": {
      "valeur": 30,
      "hypothese": true,
      "note": "annonce ancienne : le vendeur veut s'en débarrasser"
    },
    "remise_max_pct": {
      "valeur": 40,
      "hypothese": true,
      "note": "au-delà, l'offre est souvent refusée ou impossible"
    }
  }
};
const CONFIG_BASE = JSON.parse(JSON.stringify(config));
const v = (x) => x.valeur;
const r2 = (n) => Math.round(n * 100) / 100;

// Ce qu'il reste sur UN article.
// gain = prix de vente - prix d'achat - cotisations (% du prix de VENTE) - frais vendeur Vinted - emballage - autres frais
function gainArticle({ achat, vente, autresFrais = 0 }, c = config) {
  for (const n of [achat, vente, autresFrais]) if (!Number.isFinite(n) || n < 0) throw new Error('Montant invalide');
  const cotisations = vente * v(c.statut.cotisations_pct_du_prix_de_vente) / 100;
  const fraisVinted = vente * v(c.vinted.frais_vendeur_pct) / 100;
  const emballage = v(c.securite.emballage_par_article_eur);
  const gain = vente - achat - cotisations - fraisVinted - emballage - autresFrais;
  const mise = achat + emballage + autresFrais;
  return { cotisations: r2(cotisations), fraisVinted: r2(fraisVinted), emballage, gain: r2(gain), roiPct: mise > 0 ? Math.round(gain / mise * 100) : null };
}

// Feu tricolore. Le rouge gagne toujours si l'article dépasse le maximum autorisé.
function feu({ achat, vente, autresFrais = 0, stockTotal }, c = config) {
  const g = gainArticle({ achat, vente, autresFrais }, c);
  const maxParArticle = stockTotal * v(c.securite.max_pct_du_stock_par_article) / 100;
  if (achat > maxParArticle) return { couleur: 'rouge', raison: 'Trop cher pour ton budget.', ...g };
  if (g.gain >= v(c.feux.vert_gain_min_eur) && g.roiPct >= v(c.feux.vert_roi_min_pct)) return { couleur: 'vert', raison: 'Bonne affaire.', ...g };
  if (g.gain >= v(c.feux.orange_gain_min_eur)) return { couleur: 'orange', raison: 'Négocie le prix.', ...g };
  return { couleur: 'rouge', raison: 'Tu ne gagnes pas assez.', ...g };
}

// Prix d'achat maximum pour rester au vert (gain mini ET rendement mini), à 0,50 € près vers le bas.
function prixAchatMax({ vente, autresFrais = 0 }, c = config) {
  let best = 0;
  for (let a = 0; a <= vente; a = r2(a + 0.5)) {
    const g = gainArticle({ achat: a, vente, autresFrais }, c);
    if (g.gain >= v(c.feux.vert_gain_min_eur) && g.roiPct >= v(c.feux.vert_roi_min_pct)) best = a; else if (a > 0) break;
  }
  return best;
}

// Répartition du capital de départ : transport + matériel + réserve + création, le reste va au stock.
function repartitionCapital(c = config) {
  const total = v(c.depart.capital_total_eur);
  const transport = r2(v(c.depart.tickets_premier_cycle) * v(c.transport.ticket_metro_eur));
  const materiel = v(c.depart.materiel_eur), creation = v(c.depart.creation_entreprise_eur);
  const reserve = r2(total * v(c.depart.reserve_pct_du_capital) / 100);
  const stock = r2(total - transport - materiel - reserve - creation);
  if (stock <= 0) throw new Error('Capital insuffisant : il ne reste rien pour acheter des articles');
  return { total, transport, materiel, reserve, creation, stock, maxParArticle: r2(stock * v(c.securite.max_pct_du_stock_par_article) / 100) };
}

// Bilan d'un cycle : on dépense tout le stock en articles au même prix, on revend, on retire le transport.
function bilanCycle({ achat, vente, partVendue = 1 }, c = config) {
  const rep = repartitionCapital(c);
  const nb = Math.floor(rep.stock / achat), vendus = Math.floor(nb * partVendue);
  const g = gainArticle({ achat, vente }, c);
  const encaisse = r2(vendus * (vente - g.cotisations - g.fraisVinted));
  const depense = r2(nb * (achat + g.emballage) + rep.transport);
  return { nb, vendus, depense, encaisse, resultat: r2(encaisse - depense) };
}

// Nombre de ventes par mois pour atteindre un objectif de gain.
function ventesPourObjectif({ objectifMensuel, achat, vente }, c = config) {
  const g = gainArticle({ achat, vente }, c).gain;
  if (g <= 0) return Infinity;
  return Math.ceil(objectifMensuel / g);
}

const eur = (n) => n.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const P = [ // réglages modifiables : [libellé, chemin dans la config, pas]
  ['Tickets pour le 1er mois', ['depart','tickets_premier_cycle'], 1], ['Prix du ticket (€)', ['transport','ticket_metro_eur'], 0.05],
  ['Matériel (€)', ['depart','materiel_eur'], 1], ['Argent de secours (%)', ['depart','reserve_pct_du_capital'], 5],
  ['Maximum par article (% du stock)', ['securite','max_pct_du_stock_par_article'], 1], ['Cotisations (% du prix de vente)', ['statut','cotisations_pct_du_prix_de_vente'], 0.1],
  ['Emballage par article (€)', ['securite','emballage_par_article_eur'], 0.05], ['Frais vendeur Vinted (%)', ['vinted','frais_vendeur_pct'], 0.5],
  ['Exemple : prix d\'achat (€)', ['exemple','achat'], 0.5], ['Exemple : prix de vente (€)', ['exemple','vente'], 0.5]];
config.exemple = { achat: { valeur: 4, hypothese: true }, vente: { valeur: 12, hypothese: true } };
const KEY = 'dionysiades-reglages';
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) for (const [k, val] of Object.entries(s)) { const [a, b] = k.split('.'); if (config[a] && config[a][b] && Number.isFinite(val)) config[a][b].valeur = val; } } catch (e) {}
function save() { try { const s = {}; for (const [, [a, b]] of P) s[a + '.' + b] = config[a][b].valeur; s['depart.capital_total_eur'] = config.depart.capital_total_eur.valeur; localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
function origine(x) { return x.source ? '<span class="tag ok">Vérifié le ' + x.date.split('-').reverse().join('/') + '</span> ' + esc(x.source) : '<span class="tag">À vérifier</span> ' + esc(x.note || 'Chiffre choisi par prudence, modifiable dans les réglages.'); }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function ligne(nom, montant, pourquoi, src) { return '<details><summary><span>' + nom + '</span><b>' + eur(montant) + '</b></summary><p class="why">' + pourquoi + '</p><p class="why">' + src + '</p></details>'; }
function render() {
  const out = document.getElementById('out'), c = config, d = c.depart;
  let r;
  try { r = repartitionCapital(c); } catch (e) {
    out.innerHTML = '<div class="card alert"><div class="row"><div class="dot" style="background:#b91c1c"></div><p class="big">Pas assez pour commencer.</p></div><p>Il ne reste rien pour acheter des articles.</p><p class="grey">Ajoute de l\'argent, ou baisse les trajets et le matériel dans les réglages.</p></div>'; return; }
  const a = c.exemple.achat.valeur, v2 = c.exemple.vente.valeur;
  let h = '<div class="card"><p class="grey">Voici où va ton argent. Touche une ligne pour comprendre.</p>'
    + ligne('Pour acheter des articles', r.stock, 'C\'est ce qui reste quand on a mis de côté les trajets, le matériel et l\'argent de secours.', 'Calcul : ' + eur(r.total) + ' − ' + eur(r.transport) + ' − ' + eur(r.materiel) + ' − ' + eur(r.reserve) + (r.creation ? ' − ' + eur(r.creation) : '') + '.')
    + ligne('Pour les trajets', r.transport, d.tickets_premier_cycle.valeur + ' tickets à ' + eur(c.transport.ticket_metro_eur.valeur) + '.', origine(c.transport.ticket_metro_eur))
    + ligne('Pour le matériel', r.materiel, 'Ruban adhésif, mètre, emballages.', origine(d.materiel_eur))
    + ligne('On n\'y touche pas', r.reserve, 'C\'est l\'argent de secours : ' + d.reserve_pct_du_capital.valeur + ' % de ce que tu as.', origine(d.reserve_pct_du_capital)) + '</div>';
  h += '<div class="card"><div class="row"><div class="dot" style="background:#b91c1c"></div><p class="big">Règle d\'or</p></div><p>Jamais plus de <b>' + eur(r.maxParArticle) + '</b> pour un article.</p><p class="grey">C\'est ' + c.securite.max_pct_du_stock_par_article.valeur + ' % de l\'argent des articles. Un seul mauvais achat ne doit pas tout bloquer.</p></div>';

// ---------- Journal ----------
// Journal des achats et des ventes. Fonctions pures : (état, action, config) -> nouvel état.
// L'argent ne vient QUE du journal : apports, achats, dépenses, ventes payées.
const val = (x) => x.valeur;
const somme = (xs) => r2(xs.reduce((a, b) => a + b, 0));
const STATUTS = ['acheté', 'récupéré', 'photographié', 'en ligne', 'vendu', 'expédié', 'livré', 'payé'];
const rang = (s) => STATUTS.indexOf(s);
const etatVide = () => ({ seq: 0, apports: [], depenses: [], articles: [] });
const copie = (e) => JSON.parse(JSON.stringify(e));
function montant(n, nom = 'Montant') { if (!Number.isFinite(n) || n <= 0) throw new Error(nom + ' invalide'); return r2(n); }
function jour(d) { if (!/^\d{4}-\d{2}-\d{2}$/.test(d || '')) throw new Error('Date invalide'); return d; }

function bilan(etat, c, aujourdhui) {
  const apports = somme(etat.apports.map((a) => a.montant));
  const achats = somme(etat.articles.map((a) => a.achat.prix));
  const dep = (t) => somme(etat.depenses.filter((d) => d.type === t).map((d) => d.montant));
  const depenses = somme(etat.depenses.map((d) => d.montant));
  const payes = etat.articles.filter((a) => a.statut === 'payé');
  const encaisse = somme(payes.map((a) => a.vente.prix));
  const aRecevoir = somme(etat.articles.filter((a) => a.vente && a.statut !== 'payé').map((a) => a.vente.prix));
  const fraisVinted = r2(encaisse * val(c.vinted.frais_vendeur_pct) / 100);
  const cotisations = r2(encaisse * val(c.statut.cotisations_pct_du_prix_de_vente) / 100);
  const tresorerie = r2(apports - achats - depenses + encaisse - fraisVinted);
  const reserve = r2(apports * val(c.depart.reserve_pct_du_capital) / 100);
  const resteTransport = Math.max(0, r2(val(c.depart.tickets_premier_cycle) * val(c.transport.ticket_metro_eur) - dep('transport')));
  const resteMateriel = Math.max(0, r2(val(c.depart.materiel_eur) - dep('materiel')));
  const disponible = r2(tresorerie - cotisations - reserve - resteTransport - resteMateriel);
  const enStock = etat.articles.filter((a) => rang(a.statut) < rang('vendu'));
  const stockImmobilise = somme(enStock.map((a) => a.achat.prix));
  const maxParArticle = r2(Math.max(0, disponible + stockImmobilise) * val(c.securite.max_pct_du_stock_par_article) / 100);
  const benefice = r2(encaisse - fraisVinted - cotisations - somme(payes.map((a) => a.achat.prix)) - depenses);
  const compares = etat.articles.filter((a) => a.vente && a.achat.venteEstimee > 0);
  const erreurMoyennePct = compares.length ? Math.round(compares.reduce((s, a) => s + Math.abs(a.vente.prix - a.achat.venteEstimee) / a.achat.venteEstimee, 0) / compares.length * 100) : null;
  const dorment = aujourdhui ? etat.articles.filter((a) => a.statut === 'en ligne' && (Date.parse(aujourdhui) - Date.parse(a.dateStatut)) / 864e5 >= val(c.securite.jours_avant_alerte_stock)) : [];
  return { apports, achats, depenses, encaisse, aRecevoir, fraisVinted, cotisations, tresorerie, reserve, resteTransport, resteMateriel, disponible,
    stockImmobilise, maxParArticle, benefice, nbEnStock: enStock.length, nbVendus: etat.articles.filter((a) => a.vente).length, erreurMoyennePct, dorment };
}

function ajouterApport(etat, { montant: m, date }) { const e = copie(etat); e.apports.push({ montant: montant(m), date: jour(date) }); return e; }

function ajouterDepense(etat, { type, montant: m, date, note = '' }) {
  if (!['transport', 'materiel', 'autre'].includes(type)) throw new Error('Type de dépense inconnu');
  const e = copie(etat); e.depenses.push({ type, montant: montant(m), date: jour(date), note }); return e;
}

// Achat : refusé si l'argent manque ou si l'article dépasse le maximum (sauf accord de l'Admin : force).
function ajouterAchat(etat, { nom, prix, date, origine, venteEstimee = 0, force = false }, c) {
  if (!nom || !nom.trim()) throw new Error('Il manque le nom de l\'article');
  if (!origine || !origine.trim()) throw new Error('Il manque où tu l\'as acheté');
  const p = montant(prix, 'Prix'), b = bilan(etat, c);
  if (p > b.disponible) throw new Error('Tu n\'as pas assez d\'argent.');
  if (p > b.maxParArticle && !force) throw new Error('Trop cher. Maximum ' + b.maxParArticle.toFixed(2).replace('.', ',') + ' €.');
  const e = copie(etat); e.seq += 1;
  e.articles.push({ id: e.seq, nom: nom.trim(), statut: 'acheté', dateStatut: jour(date), achat: { prix: p, date, origine: origine.trim(), venteEstimee: r2(venteEstimee) || 0, force }, vente: null });
  return e;
}

// Étape suivante. Pour passer à « vendu », il faut le prix : utiliser vendre().
function avancer(etat, id, date) {
  const e = copie(etat), a = e.articles.find((x) => x.id === id);
  if (!a) throw new Error('Article introuvable');
  const suivant = STATUTS[rang(a.statut) + 1];
  if (!suivant) throw new Error('Cet article est déjà payé');
  if (suivant === 'vendu') throw new Error('Indique le prix de vente');
  a.statut = suivant; a.dateStatut = jour(date); return e;
}

function vendre(etat, id, { prix, date }) {
  const e = copie(etat), a = e.articles.find((x) => x.id === id);
  if (!a) throw new Error('Article introuvable');
  if (a.statut !== 'en ligne') throw new Error('L\'article doit être en ligne avant d\'être vendu');
  a.vente = { prix: montant(prix, 'Prix'), date: jour(date) }; a.statut = 'vendu'; a.dateStatut = date; return e;
}

// Vente annulée ou retour : l'article revient en ligne, l'argent n'est plus compté.
function annulerVente(etat, id, date) {
  const e = copie(etat), a = e.articles.find((x) => x.id === id);
  if (!a || !a.vente) throw new Error('Aucune vente à annuler');
  a.vente = null; a.statut = 'en ligne'; a.dateStatut = jour(date); return e;
}

const csv = (x) => '"' + String(x ?? '').replace(/"/g, '""') + '"';
// Export pour le comptable et base du registre des objets : une ligne par article.
function exportCSV(etat) {
  const lignes = [['N°', 'Article', 'Date achat', 'Acheté où / à qui', 'Prix achat', 'Statut', 'Date vente', 'Prix vente']];
  for (const a of etat.articles) lignes.push([a.id, a.nom, a.achat.date, a.achat.origine, a.achat.prix.toFixed(2), a.statut, a.vente?.date ?? '', a.vente ? a.vente.prix.toFixed(2) : '']);
  return lignes.map((l) => l.map(csv).join(';')).join('\n');
}
